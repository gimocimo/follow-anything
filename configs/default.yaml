# follow-anything default configuration (reference; scripts currently take these as CLI args)
seed: 42
device: auto            # auto | cuda | mps | cpu

paths:
  data_dir: data
  outputs_dir: outputs
  gsr_dir: data/soccernet-gsr

detector:
  weights: yolo11n.pt   # COCO-pretrained; person=0, sports ball=32
  classes: [0, 32]
  conf: 0.25
  imgsz: 1280           # players are small in wide broadcast shots — keep resolution high

tracker:
  name: botsort         # ultralytics built-in: botsort | bytetrack

split:
  policy: leave_one_game_out  # deterministic: test/val/train = 1st/2nd/rest game by id
  group_key: game_id          # required; whole games never cross splits (fail-closed)

eval:
  metrics: [HOTA, MOTA, IDF1]
  format: mot_challenge
